name: PR review (reusable)

# Cross-model adversarial review, callable from any repository and any owner.
# This repo is public so the workflow can be reused outside its own org: a
# reusable workflow in a private repo is only visible inside that org.
#
# The review is advisory. Agent-only review measurably lowers merge rates, so
# nothing here is a required check and nothing here blocks a merge.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. Self-hosted where the owner has runners.
        type: string
        required: false
        default: ubuntu-22.04
      critic-model:
        type: string
        required: false
        default: openai/gpt-5.1-codex
      refuter-model:
        type: string
        required: false
        default: google/gemini-3.1-pro-preview
    secrets:
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # A fork PR gets no secrets and must never run on a self-hosted runner.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The critic diffs against the merge base, which needs real history.
          fetch-depth: 0

      - uses: jroehl/gh-workflows/review@main
        with:
          pr: ${{ github.event.pull_request.number }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          critic-model: ${{ inputs.critic-model }}
          refuter-model: ${{ inputs.refuter-model }}
