name: PR review

# Cross-model adversarial review: a non-Anthropic critic reads the diff and a
# third-family refuter tries to kill each finding, because a model reviewing its
# own family's code is the weakest reviewer that change can have. The logic lives
# in jroehl/gh-workflows so one implementation serves every repo.
#
# Advisory: it never gates a merge.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # A fork PR gets no secrets, so there is nothing to run.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The critic diffs against the merge base, which needs real history.
          fetch-depth: 0

      - uses: ./
        with:
          pr: ${{ github.event.pull_request.number }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
