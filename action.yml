name: Cross-model PR review
description: Run the pr-critic adversarial review on a pull request and post the surviving findings.

inputs:
  pr:
    description: Pull request number.
    required: true
  openrouter-api-key:
    description: OpenRouter key. Each owner supplies its own.
    required: true
  github-token:
    description: Token used to read the PR and post the review.
    required: true
  base:
    description: Base ref to diff against. Defaults to the PR's own base.
    required: false
    default: ""
  critic-model:
    required: false
    default: x-ai/grok-4.3
  critic-fallback-model:
    description: Critic used when the first one fails. Empty string to disable.
    required: false
    default: openai/gpt-5.1
  refuter-model:
    required: false
    default: google/gemini-3.1-pro-preview
  post:
    description: Post the review. Set false to only produce the JSON artifact.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Not actions/setup-node: on the self-hosted runners that serve most consumers it
    # extracts into a temp dir and copies into the tool cache, ~0.46 GB of SSD writes
    # per review for a CLI with no dependencies. The binary alone is enough.
    - name: Node
      shell: bash
      env:
        NODE_VERSION: "22.23.4"
      run: |
        set -euo pipefail
        if command -v node >/dev/null && [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 20 ]; then
          echo "using $(command -v node) $(node --version)"
          exit 0
        fi
        [ "$RUNNER_OS" = Linux ] || { echo "::error::no node >= 20 on this $RUNNER_OS runner"; exit 1; }
        case "$RUNNER_ARCH" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::unsupported runner arch $RUNNER_ARCH"; exit 1 ;;
        esac
        top="node-v${NODE_VERSION}-linux-${arch}"
        file="${top}.tar.xz"
        dl="$RUNNER_TEMP/pr-critic-node"
        rm -rf "$dl"
        mkdir -p "$dl/bin"
        base="https://nodejs.org/dist/v${NODE_VERSION}"
        curl -fsSL --retry 3 -o "$dl/$file" "$base/$file"
        curl -fsSL --retry 3 -o "$dl/SHASUMS256.txt" "$base/SHASUMS256.txt"
        (cd "$dl" && grep "  ${file}\$" SHASUMS256.txt | sha256sum -c --strict -) ||
          { echo "::error::checksum mismatch for ${file}"; exit 1; }
        tar -xJf "$dl/$file" -C "$dl/bin" --strip-components=2 "$top/bin/node"
        rm -f "$dl/$file" "$dl/SHASUMS256.txt"
        echo "$dl/bin" >> "$GITHUB_PATH"
        "$dl/bin/node" --version

    - name: Review
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr }}
        BASE: ${{ inputs.base }}
        CRITIC: ${{ inputs.critic-model }}
        CRITIC_FALLBACK: ${{ inputs.critic-fallback-model }}
        REFUTER: ${{ inputs.refuter-model }}
        POST: ${{ inputs.post }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        base="${BASE:-origin/${GITHUB_BASE_REF:-main}}"
        args=(--base "$base" --pr "$PR" --repo "$REPO"
              --critic-model "$CRITIC" --critic-fallback-model "$CRITIC_FALLBACK"
              --refuter-model "$REFUTER"
              --json pr-critic.json)
        # Under set -e a bare test that returns 1 would end the step, so this is
        # written as a full if.
        if [ "$POST" = "true" ]; then args+=(--post); fi
        # A transient model outage must not turn someone's pull request red, so this
        # still exits 0. The visibility comes from the pull request instead: the CLI
        # posts a comment saying no review ran before it exits, because a warning in a
        # collapsed log is indistinguishable from a clean review. Exit 3 is the other
        # kind: credit exhausted or the key is dead, so no review will run again
        # anywhere until someone acts, and that one fails the check.
        # The action's own checkout, not a fresh npx install: GITHUB_ACTION_PATH is
        # this action at the ref that called it, so a pinned SHA pins the CLI too.
        # Installing from a ref instead let action.yml and the CLI drift apart, and
        # `uses: ./` has no ref to install at, so this repo reviewed its own pull
        # requests with the code on main. There are no runtime dependencies.
        set +e
        node "$GITHUB_ACTION_PATH/bin/pr-critic.mjs" "${args[@]}"
        rc=$?
        set -e
        if [ "$rc" -eq 3 ]; then
          echo "::error::pr-critic could not authenticate to OpenRouter (credit exhausted or key revoked). No review ran, and none will until the key is replaced."
          exit 1
        elif [ "$rc" -ne 0 ]; then
          echo "::warning::pr-critic did not complete; no review was posted. A comment saying so is on the pull request."
          exit 0
        fi

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr-critic-${{ inputs.pr }}
        path: pr-critic.json
        if-no-files-found: ignore
